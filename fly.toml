app = 'maestro-dabhand'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'maestro.dabhand.fyi'
  PORT = '8080'
  ECTO_IPV6 = 'true'
  MAESTRO_DEVELOPER_EMAILS = 'vince@vintrepid.com'
  MAIL_FROM_NAME = 'dab hand'
  MAIL_FROM_EMAIL = 'hello@dabhand.fyi'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
